version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: interview_coach_db
    restart: always
    environment:
      POSTGRES_USER: coach_user
      POSTGRES_PASSWORD: coach_password
      POSTGRES_DB: interview_coach
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: interview_coach_backend
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://coach_user:coach_password@db:5432/interview_coach
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/reports:/app/reports

volumes:
  postgres_data:
