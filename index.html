    <meta name="description" content="Intelligent AI-powered interview preparation platform with resume analysis, adaptive mock interviews, voice answering, live evaluation, ATS scoring, and personalized roadmaps." />
    <meta property="og:title" content="AI Interview Coach" />
    <meta property="og:description" content="Intelligent AI-powered interview preparation platform with resume analysis, adaptive mock interviews, voice answering, live evaluation, ATS scoring, and personalized roadmaps." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      // Suppress Vite HMR WebSocket connection errors in preview environments where WebSockets are not enabled
      window.addEventListener('unhandledrejection', function (event) {
        if (
          event.reason &&
          (String(event.reason).includes('WebSocket') ||
           String(event.reason?.message).includes('WebSocket') ||
           event.reason?.name === 'WebSocketError' ||
           String(event.reason).includes('closed without opened'))
        ) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function (event) {
        if (
          event.message &&
          (event.message.includes('WebSocket') || event.message.includes('websocket'))
        ) {
          event.preventDefault();
        }
      });
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
